<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2ECC71;stop-opacity:1" />
    </linearGradient>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap');
      .logo-text { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 64px; text-transform: uppercase; }
      .sub-text { font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 36px; fill: #2C3E50; text-transform: uppercase; letter-spacing: 4px; }
    </style>
  </defs>
  
  <!-- Content -->
  <text x="50%" y="45%" text-anchor="middle" class="logo-text" fill="url(#grad1)">PMP Mastery</text>
  <text x="50%" y="80%" text-anchor="middle" class="sub-text">Framework</text>
  
  <!-- Accent line -->
  <rect x="150" y="100" width="300" height="4" rx="2" fill="url(#grad1)" />
</svg>
