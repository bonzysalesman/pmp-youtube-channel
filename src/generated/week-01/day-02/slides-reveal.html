        :root {

            --deep: #3d1a7a;
            --gold: #c7951e;
            --white: #ffffff;
            --ink: #0f0a1e;
            --font: 'Poppins', sans-serif;
        }

        .reveal {
            font-family: var(--font);
            color: var(--ink);
        }

        .reveal h1,
        .reveal h2,
        .reveal h3,
        .reveal h4,
        .reveal h5,
        .reveal h6 {
            font-family: var(--font);
            text-transform: uppercase;
            color: var(--deep);
            font-weight: 900;
            line-height: 1.0;
            margin-bottom: 20px;
        }

        .reveal h1 {
            color: var(--purple);
            font-size: 1.618em;
            text-align: left;
        }

        .reveal h2 {
            color: var(--gold);
            font-size: 1.4em;
            text-align: left;
            margin-top: -10px;
        }

        .reveal p,
        .reveal li {
            font-size: 0.64em;
            line-height: 1.2;
            color: var(--ink);
            text-align: left;
        }

        /* Full-Bleed Split Layout */
        .reveal .split {
            display: flex;
            width: 1000px;
            height: 700px;
            margin-top: -350px !important;
            margin-left: -500px !important;
            position: absolute;
            top: 50%;
            left: 50%;
        }

        .reveal .col-text {
            flex: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2;
        }

        .reveal .col-img {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-style: italic;
        }

        .reveal .col-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Brand bar */
        .reveal .brand-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 8px;
            height: 100%;
            background: linear-gradient(180deg, var(--gold) 0%, var(--purple) 100%);
            z-index: 9999;
        }

        .reveal section.title-slide h1,
        .reveal section.title-slide h2,
        .reveal section.title-slide h4 {
            text-align: center;
        }
    </style>
