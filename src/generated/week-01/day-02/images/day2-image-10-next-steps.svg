    <g filter="url(#cardShadow)">
      <rect x="1160" y="120" width="620" height="300" rx="24" fill="white"/>
    </g>
    <rect x="1200" y="180" width="320" height="16" fill="#d4ccec"/>
    <rect x="1200" y="230" width="420" height="16" fill="#d4ccec"/>
